name: Build exe and apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Copy app source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/app | Out-Null
          Copy-Item index.html src-tauri/app/index.html
      - name: Install Tauri CLI
        run: npm install --no-save --no-audit --no-fund @tauri-apps/cli@^2
      - name: Build portable exe
        working-directory: src-tauri
        run: npx tauri build --no-bundle
      - name: Collect exe
        shell: pwsh
        run: Copy-Item src-tauri/target/release/so-ready.exe SO-Ready-Portable-${{ github.ref_name == 'main' && '1.0.0' || '1.0.0' }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: so-ready-windows-exe
          path: SO-Ready-Portable-*.exe

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Show preinstalled Android SDK
        run: |
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
      - name: Copy app source and build apk
        run: |
          cp index.html android/app/src/main/assets/index.html
          cd android
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: so-ready-android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    needs: [exe, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Rename apk and add html
        run: |
          find artifacts -name 'app-debug.apk' -execdir mv {} SO-Ready.apk \;
          cp src/index.html artifacts/SO-Ready.html
          find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.apk
            artifacts/SO-Ready.html
